<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://kizywhlnahblwhapfznt.supabase.co; connect-src 'self' https://kizywhlnahblwhapfznt.supabase.co wss://kizywhlnahblwhapfznt.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Panel · El Taller Repostería</title>
<style>
  :root{
    --rojo:#C0272D; --rojo-oscuro:#8f1c21; --amarillo:#FFFAC6; --rosa:#F6C9CE;
    --rosa-suave:#FBE6E9; --crema:#FFF6F0; --tinta:#241010; --gris:#5c4f4c;
  }
  *{box-sizing:border-box;border-radius:0 !important;}
  html,body{margin:0;padding:0;}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--crema);color:var(--tinta);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0;font-weight:700;}
  button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tinta);}
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  button,a{touch-action:manipulation;}
  @media (pointer:coarse){ input,select,textarea{font-size:16px !important;} }
  button{cursor:pointer;min-height:44px;font-weight:600;border:none;padding:0 16px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  :focus-visible{outline:3px solid var(--tinta);outline-offset:2px;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px;}
  .hidden{display:none !important;}

  .top{background:var(--rojo);color:#fff;border-bottom:5px solid var(--amarillo);}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap;}
  .top h1{font-size:22px;color:#fff;}
  .top p{margin:2px 0 0;font-size:13px;color:#fff;}
  .top .who{display:flex;gap:12px;align-items:center;font-size:14px;flex-wrap:wrap;}
  .top .who button{background:#fff;color:var(--rojo);min-height:38px;}
  .suc-sel{display:flex;align-items:center;gap:6px;font-size:13px;}
  .suc-sel select{min-height:38px;padding:0 10px;border:2px solid var(--tinta);background:var(--amarillo);color:var(--tinta);font-weight:700;font-size:14px;}
  .suc-fija{background:var(--amarillo);color:var(--tinta);padding:6px 10px;font-weight:700;font-size:13px;}
  .nbadge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;background:var(--rojo);color:#fff;font-size:12px;font-weight:700;text-align:center;border-radius:10px !important;}
  label.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gris);}
  label.mini select{min-height:36px;padding:0 6px;border:1px solid var(--tinta);background:#fff;font-size:13px;}
  .pedl-lista{display:grid;gap:12px;}
  .pedl{background:#fff;border:2px solid var(--tinta);border-left:8px solid var(--rosa);padding:12px 14px;}
  .pedl.est-nuevo{border-left-color:var(--rojo);}
  .pedl.est-preparando{border-left-color:#d9a400;}
  .pedl.est-listo{border-left-color:#2f7d32;}
  .pedl-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:16px;}
  .pedl .folio{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;}
  .pedl-meta{font-size:13px;color:var(--gris);margin:4px 0 8px;}
  .pedl-meta .tarde{color:var(--rojo-oscuro);font-weight:700;}
  .pedl-items{margin:0 0 10px;padding-left:18px;font-size:14px;}
  .pedl-items li{margin:2px 0;}

  nav.tabs{background:var(--rosa-suave);border-bottom:1px solid var(--rosa);position:sticky;top:0;z-index:5;}
  nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;}
  nav.tabs button{background:var(--rosa);white-space:nowrap;}
  nav.tabs button.on{background:var(--amarillo);box-shadow:inset 0 -3px 0 var(--rojo);}
  nav.tabs .wrap.sub{padding-top:0;gap:6px;}
  nav.tabs .sub button{background:transparent;border:1.5px solid var(--tinta);min-height:40px;padding:0 12px;font-size:14px;}
  nav.tabs .sub button.on{background:var(--rojo);color:#fff;border-color:var(--rojo);box-shadow:none;}
  nav.tabs .sub.hidden{display:none;}

  main{padding:20px 0 60px;}
  .msg{padding:12px 16px;margin-bottom:14px;font-size:14px;}
  .msg.ok{background:var(--amarillo);border-left:4px solid var(--tinta);}
  .msg.err{background:var(--rojo);color:#fff;}
  .msg.info{background:#fff;border-left:4px solid var(--rojo);}

  .box{background:#fff;border:1px solid var(--rosa);margin-bottom:16px;}
  .box > h2, .box > h3{padding:14px 16px 4px;}
  .box .in{padding:14px 16px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rosa);padding:12px 16px;}
  .row.off{background:#f3f0ef;}
  .row .nm{flex:1;min-width:170px;}
  .row .nm b{display:block;font-size:15px;}
  .row .nm small{display:block;color:var(--gris);font-size:13px;}
  .ph{width:56px;height:56px;background:var(--rosa);color:var(--rojo);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;font-weight:700;flex:none;background-size:cover;background-position:center;}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .btn-r{background:var(--rojo);color:#fff;}
  .btn-y{background:var(--amarillo);color:var(--tinta);border:1.5px solid var(--tinta);}
  .btn-o{background:#fff;border:1.5px solid var(--tinta);}
  .btn-p{background:var(--rosa);}
  .btn-s{min-height:38px;padding:0 12px;font-size:14px;}
  .st{width:46px;padding:0;background:var(--rojo);color:#fff;font-size:22px;}
  .qty{width:70px;height:44px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--tinta);}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;background:var(--rosa);}
  .tag.y{background:var(--amarillo);outline:1px solid var(--tinta);outline-offset:-1px;}
  .tag.r{background:var(--rojo);color:#fff;}
  .tag.g{background:#e3dddb;}
  .money{font-family:Georgia,serif;font-weight:700;color:var(--rojo);font-size:18px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chips button{background:var(--rosa);}
  .chips button.on{background:var(--amarillo);box-shadow:inset 0 -3px 0 var(--rojo);}

  .form{background:var(--rosa-suave);border:1px solid var(--rojo);padding:14px 16px;margin-bottom:16px;}
  .form h3{font-size:18px;margin-bottom:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .fld{margin-top:10px;}
  .fld label{display:block;font-size:13px;margin-bottom:4px;font-weight:600;}
  .fld input,.fld select,.fld textarea{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--tinta);background:#fff;font-size:16px;}
  .fld input[type=file]{height:auto;padding:8px;}
  .fld input[type=checkbox]{width:22px;height:22px;vertical-align:middle;}
  .fld textarea{height:80px;padding:10px 12px;resize:vertical;}
  .fld .note{font-size:12px;color:var(--gris);margin-top:4px;}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .acts button{flex:1;min-width:140px;}
  .err-t{color:var(--rojo-oscuro);font-weight:600;font-size:14px;min-height:20px;margin-top:8px;}
  .inline{background:var(--rosa-suave);border-top:1px dashed var(--rojo);padding:12px 16px;width:100%;}

  .login{max-width:460px;margin:30px auto;background:#fff;border:1px solid var(--rosa);border-top:5px solid var(--amarillo);padding:22px;}
  .login h2{font-size:26px;margin-bottom:6px;}
  .login p{color:var(--gris);margin:0 0 8px;}
  .login .links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .login .links button{background:none;color:var(--rojo);text-decoration:underline;padding:0;min-height:auto;}
  .login .acts button{flex:1;}

  .caja{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
  .prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px;}
  .pb{background:#fff;border:1px solid var(--rosa);text-align:left;padding:10px;min-height:78px;display:flex;flex-direction:column;gap:4px;font-weight:400;}
  .pb b{font-weight:700;font-size:14px;}
  .pb .p{color:var(--rojo);font-weight:700;}
  .pb small{color:var(--gris);font-size:12px;}
  .pb.z{background:#f3f0ef;color:#6b5f5c;}
  .pb-sz{display:flex;gap:6px;}
  .pb-sz button{flex:1;min-height:40px;background:var(--amarillo);border:1.5px solid var(--tinta);font-size:13px;padding:0 6px;}
  .ticket{background:#fff;border:1px solid var(--rosa);border-top:5px solid var(--amarillo);padding:14px 16px;position:sticky;top:70px;}
  .tl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rosa);}
  .tl .n{flex:1;font-size:14px;}
  .tl .m{min-width:70px;text-align:right;font-weight:700;}
  .tl button{min-height:36px;width:36px;padding:0;background:var(--rojo);color:#fff;font-size:18px;}
  .tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;color:var(--rojo);margin:12px 0;font-family:Georgia,serif;}
  .pay{display:flex;gap:6px;}
  .pay button{flex:1;background:#fff;border:1.5px solid var(--tinta);padding:0 6px;font-size:14px;}
  .pay button.on{background:var(--rojo);border-color:var(--rojo);color:#fff;}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--rosa);padding:12px 14px;}
  .kpi small{display:block;font-size:13px;}
  .kpi b{display:block;font-family:Georgia,serif;font-size:24px;color:var(--rojo);}
  .kpi em{display:block;font-size:12px;color:var(--gris);font-style:normal;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:12px 16px;overflow-x:auto;}
  .bc{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bb{width:100%;background:var(--rojo);min-height:2px;}
  .bc span{font-size:11px;white-space:nowrap;}
  .hbar{display:flex;align-items:center;gap:8px;padding:6px 16px;}
  .hbar .l{width:180px;font-size:13px;}
  .hbar .t{flex:1;background:var(--rosa);height:14px;}
  .hbar .f{background:var(--rojo);height:14px;}
  .hbar .v{width:100px;text-align:right;font-size:13px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rosa);vertical-align:top;}
  th{background:var(--rosa-suave);font-size:13px;}
  .scroll{overflow-x:auto;}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;letter-spacing:4px;background:var(--amarillo);padding:12px 16px;display:inline-block;margin:8px 0;}
  .empty{padding:24px 16px;color:var(--gris);}
  .loading{padding:28px 16px 10px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gris);font-size:14px;}
  /* ---- Estados de carga ---- */
  @keyframes et-gira{to{transform:rotate(360deg);}}
  @keyframes et-brillo{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  @keyframes et-barra{0%{transform:translateX(-100%);}100%{transform:translateX(250%);}}
  .spin{width:18px;height:18px;border:3px solid var(--rosa);border-top-color:var(--rojo);border-radius:50% !important;display:inline-block;animation:et-gira .8s linear infinite;flex:0 0 auto;vertical-align:-4px;}
  button .spin{width:14px;height:14px;border-width:2px;margin-right:8px;border-color:rgba(255,255,255,.45);border-top-color:#fff;}
  .btn-y .spin,.btn-o .spin,nav.tabs .spin{border-color:var(--rosa);border-top-color:var(--tinta);}
  button[aria-busy="true"]{opacity:1;cursor:progress;}
  .sk{background:linear-gradient(90deg,var(--rosa-suave) 25%,#fff 50%,var(--rosa-suave) 75%);background-size:200% 100%;animation:et-brillo 1.4s ease-in-out infinite;}
  .sk-box{background:#fff;border:1px solid var(--rosa);padding:14px 16px;margin-bottom:14px;}
  .sk-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rosa-suave);}
  .sk-row:first-of-type{border-top:none;}
  .sk-l{height:12px;} .sk-t{height:20px;width:38%;margin-bottom:8px;}
  .sk-btn{width:84px;height:34px;flex:0 0 auto;}
  .barra-ocupado{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:50;display:none;background:var(--rosa);}
  .barra-ocupado::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:var(--rojo);animation:et-barra 1s ease-in-out infinite;}
  body.ocupado .barra-ocupado{display:block;}
  @media (prefers-reduced-motion: reduce){
    .sk,.barra-ocupado::after{animation:none;}
    .spin{animation-duration:2.4s;}
  }

  @media (max-width:820px){
    .caja{grid-template-columns:1fr;}
    .ticket{position:static;}
    .kpis{grid-template-columns:1fr 1fr;}
    .grid3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .grid2,.grid3{grid-template-columns:1fr;}
    .row .nm{flex-basis:calc(100% - 70px);}
    .hbar .l{width:110px;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>El Taller · Panel</h1>
      <p id="hoyTxt">&nbsp;</p>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="tabs hidden" id="tabs"><div class="wrap" id="tabsIn"></div></nav>
<div class="barra-ocupado" aria-hidden="true"></div>
<main><div class="wrap" id="app" aria-busy="true"><div class="loading" role="status"><span class="spin" aria-hidden="true"></span>Abriendo el panel…</div></div></main>

<script src="supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
