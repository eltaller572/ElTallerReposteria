<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'">
<title>Panel · El Taller Repostería</title>
<style>
  :root{
    --rojo:#C0272D; --rojo-oscuro:#8f1c21; --amarillo:#F4D35E; --rosa:#F6C9CE;
    --rosa-suave:#FBE6E9; --crema:#FFF6F0; --tinta:#241010; --gris:#5c4f4c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--crema);color:var(--tinta);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0;letter-spacing:.3px;font-weight:700;}
  button,input{font-family:inherit;font-size:15px;color:var(--tinta);border-radius:0;}
  button{cursor:pointer;min-height:44px;font-weight:600;}
  :focus-visible{outline:3px solid var(--tinta);outline-offset:2px;}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px;}

  .top{background:var(--rojo);color:#fff;border-bottom:5px solid var(--amarillo);}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap;}
  .top h1{font-size:24px;color:#fff;}
  .top p{margin:2px 0 0;font-size:13px;color:#fff;}
  .top a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;}
  .demo{background:var(--amarillo);font-size:13px;padding:10px 0;}
  .demo b{font-weight:700;}

  .bar{background:var(--rosa-suave);border-bottom:1px solid var(--rosa);}
  .bar .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding-top:12px;padding-bottom:12px;}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .grp > span{font-size:13px;color:var(--gris);}
  .seg{display:flex;}
  .seg button{background:#fff;border:1.5px solid var(--tinta);padding:0 16px;margin-left:-1.5px;}
  .seg button:first-child{margin-left:0;}
  .seg button.on{background:var(--rojo);border-color:var(--rojo);color:#fff;position:relative;z-index:1;}

  main{padding:20px 0 40px;}
  .ok{background:var(--amarillo);padding:12px 16px;margin-bottom:16px;font-size:14px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{background:var(--rosa);border:none;padding:0 14px;min-height:44px;}
  .chip.on{background:var(--amarillo);border-bottom:3px solid var(--rojo);}
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
  .tools input[type=search]{flex:1;min-width:200px;height:44px;padding:0 12px;border:1.5px solid var(--tinta);background:#fff;}

  .list{background:#fff;border:1px solid var(--rosa);}
  .row,.it{border-top:1px solid var(--rosa);padding:12px 14px;}
  .list > :first-child{border-top:none;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .row.off{background:#f3f0ef;}
  .ph{width:52px;height:52px;background:var(--rosa);color:var(--rojo);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:24px;font-weight:700;flex:none;}
  .row.off .ph{background:#e3dddb;color:#6b5f5c;}
  .nm{flex:1;min-width:160px;}
  .nm b{font-weight:700;font-size:15px;display:block;}
  .nm small{display:block;font-size:13px;color:var(--gris);}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sw{min-width:126px;padding:0 10px;border:none;}
  .sw.on{background:var(--rojo);color:#fff;}
  .sw.no{background:#fff;border:1.5px solid var(--tinta);}
  .st{width:48px;min-height:48px;background:var(--rojo);color:#fff;border:none;font-size:24px;line-height:1;padding:0;}
  .qty{width:64px;height:48px;text-align:center;font-size:20px;font-weight:700;color:var(--rojo);border:1.5px solid var(--tinta);background:#fff;padding:0;}
  .agb{background:var(--amarillo);border:none;padding:0 14px;min-height:48px;}
  .ag0{background:var(--rojo);color:#fff;padding:0 12px;min-height:48px;display:flex;align-items:center;font-weight:700;}
  .dl{background:var(--rosa);border:none;padding:0 12px;}
  .conf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;}

  .btn{padding:0 18px;border:none;min-height:48px;}
  .btn-r{background:var(--rojo);color:#fff;}
  .btn-y{background:var(--amarillo);color:var(--tinta);}
  .btn-o{background:#fff;border:1.5px solid var(--tinta);}

  .panel{background:var(--rosa-suave);border:1px solid var(--rojo);padding:14px;margin:0 0 16px;}
  .panel h3{font-size:18px;margin-bottom:10px;}
  .it .panel{margin:10px 0 0;}
  .fld{margin-top:10px;}
  .fld label{display:block;font-size:13px;margin-bottom:4px;}
  .fld input[type=text],.fld input[type=number]{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--tinta);background:#fff;font-size:16px;}
  .fld input[type=file]{width:100%;font-size:14px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .prev{font-size:20px;font-weight:700;color:var(--rojo);margin-top:10px;min-height:28px;}
  .err{font-size:14px;color:var(--rojo-oscuro);font-weight:600;min-height:20px;margin-top:6px;}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .acts .btn{flex:1;min-width:140px;}
  .fp img{display:block;max-width:180px;max-height:180px;margin-top:8px;border:1px solid var(--rosa);}

  .pr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .am{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--rojo);}
  .gh{font-size:17px;padding:14px 14px 8px;background:var(--rosa-suave);border-top:1px solid var(--rosa);}
  .note{font-size:14px;color:var(--gris);padding:12px 14px;background:#fff;border-top:1px solid var(--rosa);}
  .empty{padding:24px 14px;color:var(--gris);}

  .hs{margin-top:24px;background:#fff;border:1px solid var(--rosa);border-top:5px solid var(--amarillo);padding:14px;}
  .hs h3{font-size:18px;margin-bottom:6px;}
  .hi{padding:8px 0;border-top:1px solid var(--rosa);}
  .hi small{display:block;font-size:13px;color:var(--gris);}
  .foot{margin-top:28px;font-size:13px;color:var(--gris);}
  .foot .btn{min-height:44px;font-size:14px;}

  .login{max-width:680px;margin:24px auto;background:#fff;border:1px solid var(--rosa);border-top:5px solid var(--amarillo);padding:24px;}
  .login h2{font-size:26px;margin-bottom:6px;}
  .login p{margin:0 0 18px;color:var(--gris);}
  .acc{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .acct{border:none;text-align:left;padding:18px;min-height:140px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .acct b{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;}
  .acct span{font-size:14px;font-weight:400;line-height:1.4;}
  .acct.o{background:var(--rojo);color:#fff;}
  .acct.w{background:var(--amarillo);color:var(--tinta);}
  .login .n2{font-size:13px;margin:18px 0 0;}
  .who{font-size:14px;}
  @media (max-width:640px){
    .acc{grid-template-columns:1fr;}
    .two{grid-template-columns:1fr;}
    .nm{min-width:0;flex-basis:calc(100% - 70px);}
    .ctl{width:100%;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Panel de El Taller</h1>
      <p>Stock del día y precios</p>
    </div>
    <a href="index.html" target="_blank" rel="noopener">Ver el sitio</a>
  </div>
</header>
<div class="demo"><div class="wrap"><b>Demo con datos de prueba.</b> Los cambios se guardan solo en este navegador y se ven en el sitio abierto en este mismo navegador.</div></div>

<div class="bar" id="bar"></div>
<main><div class="wrap" id="app"></div></main>

<script src="catalogo.js"></script>
<script>
(function(){
'use strict';
var E = window.ElTaller;
var $ = function(id){ return document.getElementById(id); };

var S = {
  rol:null, vista:'stock', cat:'Pan', pcat:'Pan', q:'',
  op:null, val:'', valg:'', conf:false, err:'', banner:'',
  esp:false, f:{n:'',p:'',q:'',d:''}, foto:'', ferr:'',
  del:null, reset:false
};
try { var r0 = sessionStorage.getItem('eltaller_demo_rol'); if(r0==='o'||r0==='w') S.rol=r0; } catch(e){}

var D, ST;
function load(){
  D = E.completo();
  ST = E.leer();
  ST.stock = ST.stock || {};
  ST.precios = ST.precios || {};
  ST.opciones = ST.opciones || {};
  ST.especiales = Array.isArray(ST.especiales) ? ST.especiales : [];
  ST.hist = Array.isArray(ST.hist) ? ST.hist : [];
}
function save(){ return E.guardar(ST); }

function esc(v){
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fm(n){ return '$' + (Math.round(n*100)/100).toLocaleString('es-MX'); }
function hora(){
  var d = new Date();
  return 'Hoy ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function quien(){ return S.rol === 'o' ? 'Dueño' : 'Trabajador'; }
function pos(v){ var n = parseFloat(v); return isFinite(n) ? Math.round(n*100)/100 : NaN; }

/* ---------------- barra superior ---------------- */
function barHTML(){
  if(!S.rol){ $('bar').innerHTML = ''; return; }
  var h = '<div class="wrap">';
  h += '<div class="grp"><span class="who">Sesión: <b>' + (S.rol==='o' ? 'Dueño' : 'Trabajador') + '</b></span>' +
       '<button class="btn btn-o" data-a="salir" style="min-height:44px">Salir</button></div>';
  h += '<div class="grp"><div class="seg">' +
    '<button data-a="vista" data-v="stock" class="' + (S.vista==='stock'?'on':'') + '">Stock del día</button>' +
    '<button data-a="vista" data-v="precios" class="' + (S.vista==='precios'?'on':'') + '">Catálogo y precios</button></div></div>';
  h += '</div>';
  $('bar').innerHTML = h;
}
function loginHTML(){
  return '<div class="login"><h2>Entrar al panel</h2>' +
    '<p>Elige con qué cuenta quieres entrar.</p>' +
    '<div class="acc">' +
    '<button class="acct o" data-a="login" data-r="o"><b>Entrar como dueño</b><span>Ve todo: stock, precios e historial de cambios.</span></button>' +
    '<button class="acct w" data-a="login" data-r="w"><b>Entrar como trabajador</b><span>Actualiza el stock del día y los precios.</span></button>' +
    '</div>' +
    '<p class="n2">Acceso de demostración. En la versión final cada persona entra con su correo y contraseña, y el dueño puede activar o desactivar cuentas.</p></div>';
}

/* ---------------- stock del día ---------------- */
function stockCats(){
  var c = [];
  D.stock.forEach(function(p){ if(c.indexOf(p.cat) < 0) c.push(p.cat); });
  return c;
}
function stockList(){
  var q = S.q.trim().toLowerCase();
  var list = [];
  D.stock.forEach(function(p){ list.push({k:E.claveStock(p), p:p, esp:false}); });
  ST.especiales.forEach(function(e){
    list.push({k:'esp|'+e.id, esp:true, e:e,
      p:{cat:'Especial del día', nombre:e.nombre, precio:e.precio, desc:e.desc, disp:e.disp}});
  });
  return list.filter(function(it){
    if(q) return it.p.nombre.toLowerCase().indexOf(q) >= 0;
    return it.p.cat === S.cat;
  });
}
function isOn(it){
  if(it.esp) return it.e.on !== false;
  return !(ST.stock[it.k] && ST.stock[it.k].on === false);
}
function rowStock(it){
  var p = it.p, on = isOn(it);
  var hasQ = p.disp !== undefined;
  var ago = hasQ && p.disp === 0;
  var k = esc(it.k);
  var meta = (p.sub ? p.sub + ' · ' : '') + fm(p.precio) + (p.precioGrande ? ' · grande ' + fm(p.precioGrande) : '');
  var h = '<div class="row' + (on ? '' : ' off') + '">';
  h += '<div class="ph" aria-hidden="true">' + esc(p.nombre.charAt(0).toUpperCase()) + '</div>';
  h += '<div class="nm"><b>' + esc(p.nombre) + '</b><small>' + esc(meta) + '</small>' +
       (it.esp ? '<small>Especial de hoy · se borra al cerrar el día</small>' : '') + '</div>';
  h += '<div class="ctl">';
  if(S.del === it.k){
    h += '<div class="conf"><span>¿Borrar este especial?</span>' +
         '<button class="btn btn-r" data-a="delok" data-k="' + k + '">Sí, borrar</button>' +
         '<button class="btn btn-o" data-a="delno">No</button></div>';
  } else {
    h += '<button class="sw ' + (on?'on':'no') + '" data-a="tog" data-k="' + k + '">' + (on ? 'Disponible' : 'No disponible') + '</button>';
    if(on && hasQ){
      h += '<button class="st" data-a="dec" data-k="' + k + '" aria-label="Quitar uno">−</button>' +
           '<input class="qty" type="number" min="0" step="1" inputmode="numeric" value="' + p.disp + '" data-a="qty" data-k="' + k + '" aria-label="Cantidad de ' + esc(p.nombre) + '">' +
           '<button class="st" data-a="inc" data-k="' + k + '" aria-label="Agregar uno">+</button>';
      h += ago ? '<span class="ag0">Agotado</span>' : '<button class="agb" data-a="ago" data-k="' + k + '">Agotado</button>';
    }
    if(it.esp) h += '<button class="dl" data-a="del" data-k="' + k + '">Borrar</button>';
  }
  h += '</div></div>';
  return h;
}
function espFormHTML(){
  var f = S.f;
  var h = '<div class="panel"><h3>Especial del día</h3>';
  h += '<div class="fld"><label for="en">Nombre</label><input id="en" type="text" maxlength="60" value="' + esc(f.n) + '" data-f="n"></div>';
  h += '<div class="two"><div class="fld"><label for="ep">Precio</label><input id="ep" type="number" min="0" step="1" inputmode="decimal" value="' + esc(f.p) + '" data-f="p"></div>' +
       '<div class="fld"><label for="eq">Cantidad</label><input id="eq" type="number" min="1" step="1" inputmode="numeric" value="' + esc(f.q) + '" data-f="q"></div></div>';
  h += '<div class="fld"><label for="ed">Descripción (opcional)</label><input id="ed" type="text" maxlength="120" value="' + esc(f.d) + '" data-f="d"></div>';
  h += '<div class="fld"><label for="ef">Foto (opcional)</label><input id="ef" type="file" accept="image/*" capture="environment"><div class="fp" id="efp">' +
       (S.foto ? '<img alt="Vista previa de la foto" src="' + S.foto + '">' : '') + '</div></div>';
  h += '<div class="err" id="eerr">' + esc(S.ferr) + '</div>';
  h += '<div class="acts"><button class="btn btn-o" data-a="espno">Cancelar</button><button class="btn btn-r" data-a="espsave">Guardar especial</button></div></div>';
  return h;
}
function stockHTML(){
  var cats = stockCats();
  var nEsp = ST.especiales.length;
  var h = '<div class="chips" role="tablist">';
  cats.forEach(function(c){
    h += '<button class="chip' + (!S.q && S.cat===c ? ' on' : '') + '" data-a="cat" data-c="' + esc(c) + '">' + esc(c) + '</button>';
  });
  h += '<button class="chip' + (!S.q && S.cat==='Especial del día' ? ' on' : '') + '" data-a="cat" data-c="Especial del día">Especial del día (' + nEsp + ')</button>';
  h += '</div>';
  h += '<div class="tools"><input type="search" id="q" placeholder="Buscar producto" value="' + esc(S.q) + '" aria-label="Buscar producto">' +
       '<button class="btn btn-y" data-a="espopen">+ Especial del día</button></div>';
  if(S.esp) h += espFormHTML();
  var items = stockList();
  h += '<div class="list">';
  if(!items.length){
    h += '<div class="empty">' + (S.q ? 'No hay productos con ese nombre.' : (S.cat==='Especial del día' ? 'Todavía no hay especiales hoy. Agrega uno con la foto y la cantidad.' : 'No hay productos en esta categoría.')) + '</div>';
  } else if(!S.q && S.cat === 'Bebidas y Bowls'){
    var subs = [];
    items.forEach(function(it){ var s = it.p.sub || 'Otros'; if(subs.indexOf(s) < 0) subs.push(s); });
    subs.forEach(function(s){
      h += '<h3 class="gh">' + esc(s) + '</h3>';
      items.filter(function(it){ return (it.p.sub || 'Otros') === s; }).forEach(function(it){ h += rowStock(it); });
    });
  } else {
    items.forEach(function(it){ h += rowStock(it); });
  }
  h += '</div>';
  return h;
}

/* acciones de stock */
function itemByKey(k){
  var m = k.match(/^esp\|(.+)$/);
  if(m){
    var e = ST.especiales.filter(function(x){ return x.id === m[1]; })[0];
    return e ? {esp:true, e:e, k:k} : null;
  }
  var p = D.stock.filter(function(x){ return E.claveStock(x) === k; })[0];
  return p ? {esp:false, p:p, k:k} : null;
}
function setDisp(k, v){
  var it = itemByKey(k); if(!it) return;
  v = Math.max(0, Math.floor(isFinite(v) ? v : 0));
  if(it.esp) it.e.disp = v;
  else ST.stock[k] = Object.assign({}, ST.stock[k], {disp:v});
  save(); load(); render();
}
function curDisp(k){
  var it = itemByKey(k); if(!it) return 0;
  return it.esp ? (it.e.disp || 0) : (it.p.disp || 0);
}
function setOn(k, on){
  var it = itemByKey(k); if(!it) return;
  if(it.esp) it.e.on = on;
  else ST.stock[k] = Object.assign({}, ST.stock[k], {on:on});
  save(); load(); render();
}

/* fotos: se reducen antes de guardarlas */
function reducirFoto(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(null); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null); };
    img.onload = function(){
      var max = 640, w = img.width, h = img.height;
      var s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function guardarEspecial(){
  var f = S.f;
  var n = f.n.replace(/\s+/g,' ').trim();
  var p = pos(f.p), q = parseInt(f.q, 10);
  if(!n){ S.ferr = 'Escribe el nombre del especial.'; return false; }
  if(!(p > 0)){ S.ferr = 'Escribe un precio mayor a cero.'; return false; }
  if(!(q >= 1)){ S.ferr = 'Escribe cuántas piezas hay.'; return false; }
  ST.especiales.push({id: Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36),
    nombre: n, precio: p, disp: q, desc: f.d.replace(/\s+/g,' ').trim(), foto: S.foto || '', on: true});
  if(!save()){
    ST.especiales.pop();
    S.ferr = 'No se pudo guardar. Prueba con otra foto o sin foto.';
    return false;
  }
  S.esp = false; S.f = {n:'',p:'',q:'',d:''}; S.foto = ''; S.ferr = '';
  S.cat = 'Especial del día'; S.q = '';
  S.banner = 'Especial guardado: ' + esc(n) + '. Ya aparece en el sitio.';
  load();
  return true;
}

/* ---------------- catálogo y precios ---------------- */
var STEP_TXT = {base:'Bizcochos', relleno:'Rellenos', cobertura:'Coberturas', tamano:'Tamaños',
                decoracion:'Decoración', color:'Colores', extras:'Añadidos'};

function info(K){
  if(K === 'B') return {kind:'B', name:'Precio base del pastel', p:D.base, zero:false};
  var t = K.charAt(0), rest = K.slice(2);
  if(t === 'S'){
    var s = D.stock.filter(function(x){ return E.claveStock(x) === rest; })[0];
    return s ? {kind:'S', key:rest, name:s.nombre, p:s.precio, pg:s.precioGrande, zero:false} : null;
  }
  if(t === 'O'){
    var i = rest.indexOf('|'), sk = rest.slice(0,i), nm = rest.slice(i+1);
    var st = D.steps.filter(function(x){ return x.key === sk; })[0];
    var o = st && st.options.filter(function(x){ return x.name === nm; })[0];
    return o ? {kind:'O', key:rest, name:o.name, p:o.price, zero:true} : null;
  }
  if(t === 'D'){
    var d = D.disenos.filter(function(x){ return x.nombre === rest; })[0];
    return d ? {kind:'D', key:rest, name:d.nombre, p:d.precio, zero:false} : null;
  }
  if(t === 'E'){
    var e = D.especiales.filter(function(x){ return x.nombre === rest; })[0];
    return e ? {kind:'E', key:rest, name:e.nombre, p:e.precio, zero:false} : null;
  }
  return null;
}
function panelPrecio(K){
  var inf = info(K); if(!inf) return '';
  var h = '<div class="panel">';
  h += '<div class="' + (inf.pg !== undefined ? 'two' : '') + '">';
  h += '<div class="fld"><label for="pv">' + (inf.pg !== undefined ? 'Precio chico' : 'Precio nuevo') + '</label>' +
       '<input id="pv" type="number" min="0" step="1" inputmode="decimal" value="' + esc(S.val) + '"></div>';
  if(inf.pg !== undefined){
    h += '<div class="fld"><label for="pg">Precio grande</label>' +
         '<input id="pg" type="number" min="0" step="1" inputmode="decimal" value="' + esc(S.valg) + '"></div>';
  }
  h += '</div>';
  h += '<div class="prev" id="pw"></div>';
  h += '<div class="err" id="perr">' + esc(S.err) + '</div>';
  h += '<div class="acts"><button class="btn btn-o" data-a="pback">Volver</button>' +
       '<button class="btn btn-r" data-a="psave">' + (S.conf ? 'Sí, cambiar de todos modos' : 'Guardar precio') + '</button></div>';
  h += '</div>';
  return h;
}
function prow(K, name, note, ptxt, edit){
  var h = '<div class="it"><div class="pr"><div class="nm"><b>' + esc(name) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</div>' +
          '<span class="am">' + esc(ptxt) + '</span>';
  if(edit && S.op !== K) h += '<button class="btn btn-y" data-a="pch" data-k="' + esc(K) + '">Cambiar</button>';
  h += '</div>';
  if(S.op === K) h += panelPrecio(K);
  return h + '</div>';
}
function preciosHTML(){
  var chips = ['Pan','Galletas','Bebidas y Bowls','Personalizador','Pasteles','Diseños y especiales'];
  var h = '<div class="chips">';
  chips.forEach(function(c){ h += '<button class="chip' + (S.pcat===c ? ' on' : '') + '" data-a="pcat" data-c="' + esc(c) + '">' + esc(c) + '</button>'; });
  h += '</div><div class="list">';
  var c = S.pcat;
  if(c === 'Pan' || c === 'Galletas' || c === 'Bebidas y Bowls'){
    var items = D.stock.filter(function(p){ return p.cat === c; });
    var subs = [];
    items.forEach(function(p){ var s = p.sub || ''; if(subs.indexOf(s) < 0) subs.push(s); });
    subs.forEach(function(s){
      if(s) h += '<h3 class="gh">' + esc(s) + '</h3>';
      items.filter(function(p){ return (p.sub || '') === s; }).forEach(function(p){
        var txt = fm(p.precio) + (p.precioGrande ? ' · grande ' + fm(p.precioGrande) : '');
        h += prow('S:' + E.claveStock(p), p.nombre, '', txt, true);
      });
    });
  } else if(c === 'Personalizador'){
    h += '<div class="note">Estos precios arman el precio de los pasteles: base + bizcocho + relleno + cobertura + tamaño + decoración + añadidos.</div>';
    h += prow('B', 'Precio base del pastel', 'Se suma siempre', fm(D.base), true);
    D.steps.forEach(function(st){
      if(!st.options) return;
      h += '<h3 class="gh">' + esc(STEP_TXT[st.key] || st.label) + '</h3>';
      st.options.forEach(function(o){
        h += prow('O:' + E.claveOpcion(st.key, o.name), o.name, '', fm(o.price), true);
      });
    });
  } else if(c === 'Pasteles'){
    h += '<div class="note">El precio de cada pastel se calcula solo: base ' + fm(D.base) + ' más su bizcocho, relleno y cobertura, con tamaño de 8 personas. Para cambiarlo, cambia los precios del personalizador.</div>';
    D.pasteles.forEach(function(p){
      h += prow('P:' + p.nombre, p.nombre, [p.base, p.relleno, p.cobertura].join(' · '), 'Desde ' + fm(p.precio), false);
    });
  } else {
    h += '<h3 class="gh">Diseños de decoración</h3>';
    D.disenos.forEach(function(p){ h += prow('D:' + p.nombre, p.nombre, '', fm(p.precio), true); });
    h += '<h3 class="gh">Especiales por pedido</h3>';
    D.especiales.forEach(function(p){ h += prow('E:' + p.nombre, p.nombre, '', fm(p.precio), true); });
  }
  h += '</div>';
  if(S.rol === 'o'){
    h += '<div class="hs"><h3>Historial de precios</h3>';
    if(!ST.hist.length) h += '<div class="hi">Todavía no hay cambios.</div>';
    ST.hist.slice(0, 15).forEach(function(e){
      h += '<div class="hi"><b>' + esc(e.n) + '</b> ' + fm(e.a) + ' → ' + fm(e.b) + '<small>' + esc(e.por) + ' · ' + esc(e.h) + '</small></div>';
    });
    h += '</div>';
  } else {
    h += '<p class="foot">Todo cambio de precio queda registrado con quién lo hizo y cuándo.</p>';
  }
  return h;
}
function prevPrecio(){
  var inf = S.op && info(S.op);
  var w = $('pw'); if(!inf || !w) return;
  var nv = pos(($('pv') || {}).value), ng = $('pg') ? pos($('pg').value) : NaN;
  var t = [];
  if(isFinite(nv)) t.push(fm(inf.p) + ' → ' + fm(nv));
  if(inf.pg !== undefined && isFinite(ng)) t.push('grande ' + fm(inf.pg) + ' → ' + fm(ng));
  w.textContent = t.join('   ·   ');
}
function guardarPrecio(){
  var inf = info(S.op); if(!inf) return false;
  var nv = pos(S.val), hasG = inf.pg !== undefined, ng = hasG ? pos(S.valg) : null;
  var minOk = inf.zero ? 0 : 0.01;
  if(!isFinite(nv) || nv < minOk){ S.err = inf.zero ? 'Escribe un precio de cero o más.' : 'Escribe un precio mayor a cero.'; S.conf = false; return false; }
  if(hasG && (!isFinite(ng) || ng <= 0)){ S.err = 'Escribe un precio grande mayor a cero.'; S.conf = false; return false; }
  var cambia = (nv !== inf.p) || (hasG && ng !== inf.pg);
  if(!cambia){ S.err = 'No cambiaste ningún precio.'; S.conf = false; return false; }
  var grande = function(a, b){ return a > 0 && Math.abs(b - a) / a > 0.3; };
  if(!S.conf && (grande(inf.p, nv) || (hasG && grande(inf.pg, ng)))){
    S.conf = true; S.err = 'El cambio es de más del 30%. Revisa que no falte o sobre un cero.'; return false;
  }
  var por = quien(), h = hora();
  if(inf.kind === 'B') ST.base = nv;
  else if(inf.kind === 'O') ST.opciones[inf.key] = nv;
  else if(inf.kind === 'S') ST.precios[inf.key] = Object.assign({}, ST.precios[inf.key], hasG ? {p:nv, pg:ng} : {p:nv});
  else if(inf.kind === 'D') ST.precios[E.claveDiseno({nombre:inf.key})] = {p:nv};
  else if(inf.kind === 'E') ST.precios[E.claveEspecial({nombre:inf.key})] = {p:nv};
  if(nv !== inf.p) ST.hist.unshift({n:inf.name, a:inf.p, b:nv, por:por, h:h});
  if(hasG && ng !== inf.pg) ST.hist.unshift({n:inf.name + ' (grande)', a:inf.pg, b:ng, por:por, h:h});
  ST.hist = ST.hist.slice(0, 60);
  if(!save()){ S.err = 'No se pudo guardar el cambio en este navegador.'; return false; }
  S.banner = 'Precio actualizado: ' + esc(inf.name) + ' de ' + fm(inf.p) + ' a ' + fm(nv) + '. Ya se ve en el sitio.';
  S.op = null; S.err = ''; S.conf = false;
  load();
  return true;
}

/* ---------------- pie y render ---------------- */
function footHTML(){
  var h = '<div class="foot">';
  if(S.reset){
    h += '<div class="conf"><span>Se borrarán el stock, los precios y el historial de prueba.</span>' +
         '<button class="btn btn-r" data-a="rsok">Sí, reiniciar</button><button class="btn btn-o" data-a="rsno">Cancelar</button></div>';
  } else {
    h += '<button class="btn btn-o" data-a="rs">Reiniciar datos de prueba</button>';
  }
  return h + '</div>';
}
function render(){
  barHTML();
  if(!S.rol){ $('app').innerHTML = loginHTML(); return; }
  var h = '';
  if(S.banner) h += '<div class="ok" role="status">' + S.banner + '</div>';
  h += (S.vista === 'stock') ? stockHTML() : preciosHTML();
  h += footHTML();
  $('app').innerHTML = h;
  prevPrecio();
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var a = b.getAttribute('data-a'); if(!a) return;
  var k = b.getAttribute('data-k');
  var c = b.getAttribute('data-c');

  if(a === 'login'){
    S.rol = b.getAttribute('data-r');
    try { sessionStorage.setItem('eltaller_demo_rol', S.rol); } catch(_){}
    S.vista = 'stock'; S.op = null; S.err = ''; S.conf = false; S.banner = ''; S.q = '';
    render(); return;
  }
  if(a === 'salir'){
    S.rol = null; S.op = null; S.esp = false; S.del = null; S.reset = false; S.banner = ''; S.err = ''; S.conf = false;
    try { sessionStorage.removeItem('eltaller_demo_rol'); } catch(_){}
    render(); return;
  }
  if(a === 'vista'){ S.vista = b.getAttribute('data-v'); S.op = null; S.err = ''; S.conf = false; S.banner = ''; render(); return; }

  if(a === 'cat'){ S.cat = c; S.q = ''; S.banner = ''; render(); return; }
  if(a === 'tog'){ var it = itemByKey(k); if(it){ setOn(k, !isOn({esp:it.esp, e:it.e, k:k})); } return; }
  if(a === 'inc'){ S.banner = ''; setDisp(k, curDisp(k) + 1); return; }
  if(a === 'dec'){ S.banner = ''; setDisp(k, curDisp(k) - 1); return; }
  if(a === 'ago'){ S.banner = ''; setDisp(k, 0); return; }
  if(a === 'del'){ S.del = k; render(); return; }
  if(a === 'delno'){ S.del = null; render(); return; }
  if(a === 'delok'){
    var m = k.match(/^esp\|(.+)$/);
    if(m){ ST.especiales = ST.especiales.filter(function(x){ return x.id !== m[1]; }); save(); }
    S.del = null; load(); render(); return;
  }
  if(a === 'espopen'){ S.esp = true; S.ferr = ''; S.banner = ''; S.vista = 'stock'; render(); var en = $('en'); if(en) en.focus(); return; }
  if(a === 'espno'){ S.esp = false; S.ferr = ''; S.foto = ''; S.f = {n:'',p:'',q:'',d:''}; render(); return; }
  if(a === 'espsave'){ if(guardarEspecial()){ render(); } else { var er = $('eerr'); if(er) er.textContent = S.ferr; } return; }

  if(a === 'pcat'){ S.pcat = c; S.op = null; S.err = ''; S.conf = false; S.banner = ''; render(); return; }
  if(a === 'pch'){
    var inf = info(k); if(!inf) return;
    S.op = k; S.val = String(inf.p); S.valg = (inf.pg !== undefined) ? String(inf.pg) : ''; S.err = ''; S.conf = false; S.banner = '';
    render(); var pv = $('pv'); if(pv){ pv.focus(); pv.select(); } return;
  }
  if(a === 'pback'){ S.op = null; S.err = ''; S.conf = false; render(); return; }
  if(a === 'psave'){
    var pv2 = $('pv'), pg2 = $('pg');
    if(pv2) S.val = pv2.value;
    if(pg2) S.valg = pg2.value;
    guardarPrecio();
    render();
    return;
  }

  if(a === 'rs'){ S.reset = true; render(); return; }
  if(a === 'rsno'){ S.reset = false; render(); return; }
  if(a === 'rsok'){
    E.reiniciar(); S.reset = false; S.op = null; S.del = null; S.esp = false; S.banner = 'Datos de prueba reiniciados.';
    load(); render(); return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute('data-a') === 'qty'){
    S.banner = '';
    var v = parseInt(t.value, 10);
    setDisp(t.getAttribute('data-k'), isFinite(v) ? v : 0);
    return;
  }
  if(t.id === 'ef' && t.files && t.files[0]){
    reducirFoto(t.files[0], function(url){
      if(!url){ S.ferr = 'No se pudo leer esa foto. Prueba con otra.'; S.foto = ''; }
      else { S.ferr = ''; S.foto = url; }
      var p = $('efp'); if(p) p.innerHTML = S.foto ? '<img alt="Vista previa de la foto" src="' + S.foto + '">' : '';
      var er = $('eerr'); if(er) er.textContent = S.ferr;
    });
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id === 'q'){
    S.q = t.value; S.banner = '';
    var pos0 = t.selectionStart;
    render();
    var q2 = $('q'); if(q2){ q2.focus(); try { q2.setSelectionRange(pos0, pos0); } catch(_){} }
    return;
  }
  var f = t.getAttribute && t.getAttribute('data-f');
  if(f){ S.f[f] = t.value; var er = $('eerr'); if(er) er.textContent = ''; return; }
  if(t.id === 'pv' || t.id === 'pg'){
    S.conf = false; S.err = '';
    var pe = $('perr'); if(pe) pe.textContent = '';
    var sv = document.querySelector('[data-a="psave"]'); if(sv) sv.textContent = 'Guardar precio';
    prevPrecio();
  }
});

window.addEventListener('storage', function(e){
  if(e.key !== E.KEY) return;
  if(S.op || S.esp) return;
  load(); render();
});

load();
render();
})();
</script>
</body>
</html>
