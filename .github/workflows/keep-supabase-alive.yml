name: Mantener Supabase activo

# Supabase (plan gratis) pausa el proyecto si pasa 7 días sin uso.
# Esto hace una consulta pequeña cada 3 días para que eso no pase.
# Usa solo datos públicos (el menú) y la llave pública, así que no necesita secrets.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        env:
          SUPABASE_URL: https://kizywhlnahblwhapfznt.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_U1Ym5aJHk9akwOd4JTn2ZQ_z4T06bKB
        run: |
          set -euo pipefail
          CODIGO=$(curl -s -o respuesta.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/menu_items?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}")
          echo "Respuesta de Supabase: ${CODIGO}"
          cat respuesta.json; echo
          if [ "${CODIGO}" != "200" ]; then
            echo "Supabase no respondió bien (código ${CODIGO})"; exit 1
          fi
          echo "Supabase activo"
